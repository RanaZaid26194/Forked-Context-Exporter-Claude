<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Handoff</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="popup">

    <!-- Toast — fixed top banner, never overlaps content below -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast-icon" aria-hidden="true">✓</span>
      <span id="toastMsg"></span>
    </div>

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="#7C3AED"/>
          <text x="14" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="700"
                fill="white" text-anchor="middle" dominant-baseline="auto">CH</text>
        </svg>
      </div>
      <div class="header-text">
        <h1 class="app-name">Context Handoff</h1>
        <span class="app-version">v0.3.0 · Phase 3</span>
      </div>
      <button class="icon-btn" id="optionsLink" title="Settings" aria-label="Open settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Status bar -->
    <div class="status-bar">
      <span class="status-dot" id="statusDot" data-status="idle" aria-hidden="true"></span>
      <span class="status-label" id="statusLabel">Initialising…</span>
    </div>

    <!-- Main action -->
    <main class="main">

      <!-- Primary: Handoff Prompt (recommended) -->
      <button class="btn-export" id="exportHandoffBtn" disabled>
        <span class="btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 17H5a2 2 0 0 0-2 2"/>
            <path d="M15 17h4a2 2 0 0 1 2 2"/>
            <rect x="7" y="3" width="10" height="11" rx="2"/>
            <line x1="12" y1="14" x2="12" y2="17"/>
          </svg>
        </span>
        <span class="btn-label">Export Handoff Prompt</span>
        <span class="btn-badge">Recommended</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <!-- Conversation metadata (populated after export) -->
      <p class="conv-meta" id="convMeta"></p>

      <!-- Secondary actions row -->
      <div class="secondary-actions">
        <button class="btn-secondary" id="exportSummaryBtn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="9" x2="15" y2="9"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
            <line x1="9" y1="15" x2="12" y2="15"/>
          </svg>
          Export Summary
        </button>
        <button class="btn-secondary" id="exportTranscriptBtn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Full Transcript
        </button>
      </div>

      <!-- Handoff destinations — enabled only after handoff prompt is generated -->
      <div class="handoff-destinations">
        <button class="btn-secondary btn-destination btn-gpt" id="sendToGPTBtn" disabled
                title="Generate a Handoff Prompt first, then click to open ChatGPT and fill it">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Send HandOff to GPT
        </button>

        <button class="btn-secondary btn-destination btn-gemini" id="sendToGeminiBtn" disabled
                title="Generate a Handoff Prompt first, then click to open Gemini and fill it">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Send HandOff to Gemini
        </button>

        <button class="btn-secondary btn-destination btn-grok" id="sendToGrokBtn" disabled
                title="Generate a Handoff Prompt first, then click to open Grok and fill it">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Send HandOff to Grok
        </button>
      </div>

    </main>

  </div>

  <!-- Load libs before popup.js -->
  <script src="../lib/formatter.js"></script>
  <script src="../lib/summarizer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
